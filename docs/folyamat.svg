<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5c5c58"/>
    </marker>
  </defs>
  <rect width="960" height="420" rx="16" fill="#ffffff"/>
  <rect x="1" y="1" width="958" height="418" rx="16" fill="none" stroke="#e2e1dc"/>

  <text x="40" y="44" font-size="20" font-weight="700" fill="#1e1e1c">Hogyan készül a könyv?</text>
  <text x="40" y="68" font-size="13.5" fill="#6b6b66">Egy nagy modell ír, egy kis modell lektorál – a döntés mindig a tiéd.</text>

  <!-- 1. Adatok -->
  <rect x="40" y="100" width="190" height="110" rx="12" fill="#f1f1ee" stroke="#d6d5cf"/>
  <text x="58" y="128" font-size="15" font-weight="700" fill="#3b5bdb">1. Adatok</text>
  <text x="58" y="152" font-size="13" fill="#1e1e1c">kinek, milyen szinten,</text>
  <text x="58" y="171" font-size="13" fill="#1e1e1c">mi legyen benne</text>
  <text x="58" y="190" font-size="13" fill="#1e1e1c">és hogyan (K1, K2…)</text>

  <!-- 2. Tartalomjegyzék -->
  <rect x="290" y="100" width="230" height="110" rx="12" fill="#f1f1ee" stroke="#d6d5cf"/>
  <text x="308" y="128" font-size="15" font-weight="700" fill="#3b5bdb">2. Tartalomjegyzék</text>
  <text x="308" y="152" font-size="13" fill="#1e1e1c">író megtervezi, lektor pontozza,</text>
  <text x="308" y="171" font-size="13" fill="#1e1e1c">te szerkeszted</text>
  <text x="308" y="190" font-size="13" font-weight="600" fill="#2f9e44">✓ jóváhagyás</text>

  <!-- 3. Írás -->
  <rect x="580" y="100" width="340" height="250" rx="12" fill="#f7f8ff" stroke="#c5cff7"/>
  <text x="598" y="128" font-size="15" font-weight="700" fill="#3b5bdb">3. Írás – szakaszonként</text>

  <rect x="604" y="146" width="130" height="54" rx="10" fill="#ffffff" stroke="#7048e8" stroke-width="1.5"/>
  <text x="669" y="170" font-size="13.5" font-weight="700" fill="#7048e8" text-anchor="middle">✍ Író</text>
  <text x="669" y="188" font-size="12" fill="#6b6b66" text-anchor="middle">megírja / átdolgozza</text>

  <rect x="766" y="146" width="130" height="54" rx="10" fill="#ffffff" stroke="#0c8599" stroke-width="1.5"/>
  <text x="831" y="170" font-size="13.5" font-weight="700" fill="#0c8599" text-anchor="middle">🔍 Lektor</text>
  <text x="831" y="188" font-size="12" fill="#6b6b66" text-anchor="middle">pontoz 1–10</text>

  <path d="M734,165 L762,165" stroke="#5c5c58" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M831,200 L831,236" stroke="#5c5c58" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="712" y="240" width="200" height="46" rx="10" fill="#ffffff" stroke="#d6d5cf"/>
  <text x="812" y="259" font-size="12.5" fill="#1e1e1c" text-anchor="middle">elérte a ponthatárt, és nincs</text>
  <text x="812" y="276" font-size="12.5" fill="#1e1e1c" text-anchor="middle">kötelező javítás?</text>

  <path d="M712,263 L669,263 L669,204" stroke="#e8590c" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="660" y="232" font-size="12" font-weight="600" fill="#e8590c" text-anchor="end">nem →</text>
  <text x="660" y="248" font-size="12" font-weight="600" fill="#e8590c" text-anchor="end">átdolgozás</text>
  <text x="660" y="264" font-size="11.5" fill="#6b6b66" text-anchor="end">(max. N kör)</text>

  <path d="M812,286 L812,312" stroke="#2f9e44" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="821" y="304" font-size="12" font-weight="600" fill="#2f9e44">igen</text>
  <text x="750" y="334" font-size="13" font-weight="700" fill="#2f9e44" text-anchor="middle">kész – a legjobb változat marad</text>

  <!-- 4. Export -->
  <rect x="290" y="270" width="230" height="80" rx="12" fill="#f1f1ee" stroke="#d6d5cf"/>
  <text x="308" y="298" font-size="15" font-weight="700" fill="#3b5bdb">4. Export</text>
  <text x="308" y="322" font-size="13" fill="#1e1e1c">nyomtatható HTML (→ PDF)</text>
  <text x="308" y="340" font-size="13" fill="#1e1e1c">vagy Markdown</text>

  <!-- nyilak a lépések között -->
  <path d="M230,155 L286,155" stroke="#5c5c58" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M520,155 L576,155" stroke="#5c5c58" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M580,310 L524,310" stroke="#5c5c58" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <text x="40" y="392" font-size="12.5" fill="#6b6b66">Minden helyben fut az Ollamán keresztül – a szöveg nem hagyja el a gépedet.</text>
</svg>
